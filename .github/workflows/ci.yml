name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS
        run: composer run phpcs

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -not -name '._*' -print0 | xargs -0 -n1 php -l

  package:
    runs-on: ubuntu-latest
    needs: [ syntax ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Build installable zip
        run: |
          chmod +x build-release.sh
          ./build-release.sh

          VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' webba-deploy.php | head -n 1 | tr -d '[:space:]')"

          mkdir -p dist
          cp "../webba-deploy-dist/webba-deploy-${VERSION}.zip" "dist/webba-deploy-${VERSION}.zip"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webba-deploy-${{ env.VERSION }}-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
