# Deploy to WordPress via Webba Deploy push-to-deploy.
#
# 1. In WordPress: Webba Deploy → Push-to-deploy — copy the plugin or theme secret.
# 2. In WordPress: Webba Deploy → Dashboard — copy the Deploy URL for your package.
# 3. Add repository secrets:
#      WEBBA_DEPLOY_URL    — the Deploy URL (no secret)
#      WEBBA_DEPLOY_SECRET — the matching plugin/theme secret
#
# Example URL shape:
#   https://yoursite.com/wp-json/webba-deploy/v1/deploy?package=my-plugin&type=plugin

name: Deploy to WordPress

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webba Deploy
        run: |
          curl -fsS -X POST \
            -H "X-Webba-Deploy-Secret: ${{ secrets.WEBBA_DEPLOY_SECRET }}" \
            "${{ secrets.WEBBA_DEPLOY_URL }}"
